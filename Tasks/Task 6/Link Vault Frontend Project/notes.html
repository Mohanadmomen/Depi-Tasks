<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Vault - Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="index.html">
            <i class="bi bi-safe2"></i> Link Vault
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="bookmarks.html">Bookmarks</a></li>
                <li class="nav-item"><a class="nav-link active" href="notes.html">Notes</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small" id="user-email">loading...</span>
                <i class="bi bi-moon-stars theme-switch" id="theme-toggle" title="Toggle Dark Mode"></i>
                <button class="btn btn-outline-danger btn-sm" id="logout-btn">
                    <i class="bi bi-box-arrow-right"></i> Sign Out
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Notes</h2>
        <button class="btn btn-primary" id="create-note-btn">
            <i class="bi bi-plus-lg"></i> New Note
        </button>
    </div>

    <!-- Filter Section -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Category Filter</label>
                    <select class="form-select" id="filter-category">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-5">
                     <label class="form-label">Search</label>
                     <input type="text" class="form-control" id="filter-search" placeholder="Search title or content...">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-secondary w-100" id="clear-filters-btn">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notes Table -->
    <div class="card shadow-sm">
        <div class="card-body table-responsive" id="data-container">
            <p class="text-center text-muted my-4">Loading notes...</p>
        </div>
    </div>
</div>

<div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1055;"></div>

<!-- Create/Edit Modal -->
<div class="modal fade" id="noteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="noteModalTitle">New Note</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="note-form">
                    <input type="hidden" id="note-id">
                    <div class="mb-3">
                        <label for="note-title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="note-title" required>
                    </div>
                    <div class="mb-3">
                        <label for="note-content" class="form-label">Content</label>
                        <textarea class="form-control" id="note-content" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="note-category" class="form-label">Category <span class="text-danger">*</span></label>
                        <select class="form-select" id="note-category" required>
                            <option value="" disabled selected>Select a category...</option>
                        </select>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Save Note</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script> 
<script src="notes.js"></script> 
</body>
</html>
