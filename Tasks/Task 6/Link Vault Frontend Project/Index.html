<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Vault - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="index.html">
            <i class="bi bi-safe2"></i> Link Vault
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html" id="nav-categories">Categories</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="bookmarks.html" id="nav-bookmarks">Bookmarks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="notes.html" id="nav-notes">Notes</a>
                </li>
            </ul>
            
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small" id="user-email">loading...</span>
                
                <i class="bi bi-moon-stars theme-switch" id="theme-toggle" title="Toggle Dark Mode"></i>
                
                <button class="btn btn-outline-danger btn-sm" id="logout-btn">
                    <i class="bi bi-box-arrow-right"></i> Sign Out
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 id="page-title">Categories</h2>
        <button class="btn btn-primary" id="create-new-btn">
            <i class="bi bi-plus-lg"></i> New Category
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive" id="data-container">
            <p class="text-center text-muted my-4">Loading data...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1055;"></div>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categoryModalTitle">New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="category-form">
                    <input type="hidden" id="category-id">
                    <div class="mb-3">
                        <label class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="category-name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (Optional)</label>
                        <textarea class="form-control" id="category-desc" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="save-category-btn">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="categories.js"></script>
</body>
</html>
