<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Vault - Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

    <div class="container h-100 d-flex justify-content-center align-items-center">
        <div class="card card-auth p-4 p-md-5">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="bi bi-safe2"></i>
                </div>
                <h3 class="fw-bold text-dark" id="form-title">Login</h3>
                <p class="text-muted small">Securely manage your data</p>
            </div>
            
            <div id="auth-error" class="alert alert-danger d-flex align-items-center hidden mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span>Authentication Failed</span>
            </div>

            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
                    <label for="login-email">Email address</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="login-password" placeholder="Password" required>
                    <label for="login-password">Password</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-auth" id="login-btn">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                </button>
                <div class="auth-footer">
                    <p class="mb-0">Don't have an account? <a href="#" id="show-register">Register here</a></p>
                </div>
            </form>

            <form id="register-form" class="hidden">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="reg-name" placeholder="John Doe" required>
                    <label for="reg-name">Full Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required>
                    <label for="reg-email">Email address</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="reg-password" placeholder="Password" required>
                    <label for="reg-password">Password</label>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-auth bg-success" id="register-btn">
                    <i class="bi bi-person-plus-fill me-2"></i> Register
                </button>
                <div class="auth-footer">
                    <p class="mb-0">Already have an account? <a href="#" id="show-login">Login here</a></p>
                </div>
            </form>

        </div>
    </div>

<script src="auth.js"></script>
</body>
</html>
